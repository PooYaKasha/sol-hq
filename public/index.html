<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sol HQ</title>
<link rel="icon" type="image/svg+xml" href="/assets/app-icon.svg">
<link rel="apple-touch-icon" href="/assets/app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/config.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#/hq"><span class="bmark" aria-hidden="true"></span><span><h1>Sol HQ</h1><small>MatchNice, PBC · the nervous system, at a glance</small></span></a>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Views"></nav>
    <span class="spacer"></span>
    <label class="ctl">Viewing as <select id="role" aria-label="Viewing as"></select></label>
    <button id="p-open" class="ghost" type="button" aria-pressed="false" title="Show or hide the Thread panel">Thread</button>
    <button id="s-open" class="ghost" type="button" title="Search (Cmd-K or /)">Search <kbd>/</kbd></button>
  </header>

  <div id="ask-home">
  <form id="ask" class="askbar" autocomplete="off">
    <span class="mark" aria-hidden="true"></span>
    <span id="scope" class="scope" hidden><b></b><button type="button" aria-label="Ask everywhere instead">✕</button></span>
    <input id="q" type="text" name="q" placeholder="Ask Sol anything, or find a deal, agent, project, file or folder" aria-label="Ask Sol">
    <button class="cta enter" type="submit" aria-label="Ask Sol" title="Ask Sol · Enter">↵</button>
  </form>
  </div>

  <div class="main">
    <main id="view" class="view" aria-live="polite"></main>
    <div id="hdiv" role="separator" aria-orientation="vertical" aria-label="Resize the map and the panel. Arrow keys move it, double-click resets" tabindex="0" aria-valuemin="300" aria-valuemax="720" aria-valuenow="380" hidden><i></i></div>
    <aside id="panel" class="panel" data-snap="peek" data-pm="thread" hidden aria-label="Thread and info">
      <button type="button" class="grab" id="grab" aria-label="Panel height. Tap or drag to change it" aria-expanded="false"><i></i></button>
      <div class="rp-head">
        <div class="rp-sw" role="tablist" aria-label="Panel view">
          <button type="button" role="tab" id="pm-thread" aria-selected="true" aria-controls="p-thread">Thread</button>
          <button type="button" role="tab" id="pm-info" aria-selected="false" aria-controls="p-info" tabindex="-1">Info</button>
        </div>
        <span class="rp-ttl" id="rp-ttl"></span>
        <button type="button" class="ghost small" id="panel-x" aria-label="Close the panel">✕</button>
      </div>
      <div class="rp-body" id="rp-body">
        <section id="p-thread" role="tabpanel" aria-labelledby="pm-thread"><div class="kicker">Thread<span id="thr-scope"></span></div><div id="log" class="log" aria-live="polite"></div></section>
        <section id="p-info" role="tabpanel" aria-labelledby="pm-info" hidden><div id="panel-body"></div></section>
      </div>
    </aside>
  </div>

  <footer class="foot">
    <span id="fresh"></span>
    <span id="bodies"></span>
    <span id="version"></span>
    <span>Private. Nothing here moves money or sends anything.</span>
  </footer>
</div>

<dialog id="search" class="sdlg" aria-label="Search">
  <input id="s-q" type="search" placeholder="Search bodies, deals, accounts, rows, files, folders" aria-label="Search">
  <div id="s-res" class="sres" role="listbox"></div>
</dialog>

<script type="module" src="/app.js"></script>
</body>
</html>
